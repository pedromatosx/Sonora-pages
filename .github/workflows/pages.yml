name: Publicar Sonora
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sonora-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar site
        run: npm run check
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site/src
          cp index.html styles.css icon.svg _site/
          cp src/app.mjs src/music.mjs src/catalog.mjs _site/src/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar HTTP
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          curl -fsSL --retry 6 --retry-delay 4 "$SITE_URL" -o /tmp/sonora.html
          grep -q 'Sonora — Seu som' /tmp/sonora.html
          curl -fsSL "$SITE_URL"src/app.mjs -o /tmp/sonora-app.mjs
          grep -q 'render()' /tmp/sonora-app.mjs
